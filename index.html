<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mafia LAN - Play Mafia with friends over Wifi/LAN</title>
    <meta name="description" content="Play Mafia with friends over local Wifi and LAN without internet. Zero-config cross-platform social deduction game for Android, iOS, and Web." />
    <meta property="og:title" content="Mafia LAN - Play Mafia with friends over Wifi/LAN" />
    <meta property="og:description" content="Play Mafia with friends over local Wifi and LAN without internet. Zero-config cross-platform social deduction game for Android, iOS, and Web." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA: installable on Android/iOS/desktop, works offline after first load -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mafia LAN" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register the offline shell. Relative paths keep this working under a
      // GitHub Pages sub-path (e.g. /Mafia-LAN/) as well as at a domain root.
      window.addEventListener('load', function () {
        if (!('serviceWorker' in navigator)) return;
        var secure = location.protocol === 'https:' || ['localhost', '127.0.0.1'].indexOf(location.hostname) !== -1;
        if (!secure) return;
        navigator.serviceWorker.register(new URL('sw.js', document.baseURI), { scope: './' }).catch(function (err) {
          console.warn('[PWA] service worker registration failed:', err);
        });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
