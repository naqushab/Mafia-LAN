name: Mafia LAN - CI/CD Multiplatform Build (Web, Android APK, iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. WEB APP: Lint, Unit Tests, Vite Production Bundle
  # =========================================================================
  build-web:
    name: 🌐 Web App (TypeScript & Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🧪 Run Automated Game Engine Unit Tests
        run: |
          echo "Executing Mafia deterministic state machine, live engine and signaling tests..."
          npm test

      - name: 🔍 TypeScript Static Type Checking
        run: npx tsc --noEmit

      - name: ⚡ Compile Vite Production Web Application
        env:
          # GitHub Pages serves project sites under /<repo>/, so asset URLs need that base.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: 📤 Upload Web Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mafia-lan-web-production
          path: dist/
          retention-days: 14

      - name: 🧾 Verify PWA Shell (manifest + service worker)
        run: |
          set -e
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          grep -q 'manifest.webmanifest' dist/index.html
          grep -q "/${{ github.event.repository.name }}/assets/" dist/index.html
          echo "PWA shell present and base path /${{ github.event.repository.name }}/ baked into dist/index.html"

  # =========================================================================
  # 1b. DEPLOY: Publish the PWA to GitHub Pages (main branch / manual runs)
  # =========================================================================
  deploy-web:
    name: 🚀 Deploy PWA to GitHub Pages
    needs: build-web
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: 📥 Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: mafia-lan-web-production
          path: dist

      - name: 🗂️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Package Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 🌍 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =========================================================================
  # 2. ANDROID: Native Standalone APK Compilation
  # =========================================================================
  build-android:
    name: 🤖 Android Standalone APK (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Make Gradle Wrapper Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: 🔨 Compile Android Debug APK
        run: |
          echo "Building debug APK with embedded Ktor WebSocket & mDNS lock..."
          if [ -d "android" ]; then
            cd android
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🔏 Generate Release APK & Self-Sign (Fallback / Release Pipeline)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "No signing secret provided. Assembling unsigned release APK..."
            ./gradlew assembleRelease --stacktrace --no-daemon || true
          fi

      - name: 📋 Compute APK Checksums (SHA-256)
        run: |
          echo "=== SHA-256 Android APK Checksums ==="
          find . -type f -name "*.apk" -exec sha256sum {} + || true

      - name: 📤 Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mafia-lan-android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 📤 Upload Android Release APK Artifact (if available)
        uses: actions/upload-artifact@v4
        with:
          name: mafia-lan-android-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore

  # =========================================================================
  # 3. iOS: Native Swift / Xcode Archive & Ad-Hoc Build
  # =========================================================================
  build-ios:
    name: 🍎 iOS Native App (Xcode)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: 🔍 Validate iOS Info.plist & Bonjour Configuration
        run: |
          echo "Verifying NSLocalNetworkUsageDescription and Bonjour services..."
          PLIST_PATH="ios/MafiaLAN/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            PLIST_PATH="MafiaLAN/Info.plist"
          fi
          grep -q "NSLocalNetworkUsageDescription" "$PLIST_PATH"
          grep -q "_mafia-lan._tcp" "$PLIST_PATH"
          echo "Bonjour network configuration verified in $PLIST_PATH."

      - name: 📦 Resolve Swift Package Dependencies
        run: |
          if [ -d "ios" ]; then
            cd ios
          fi
          if [ -f "MafiaLAN.xcodeproj/project.pbxproj" ]; then
            xcodebuild -resolvePackageDependencies -project MafiaLAN.xcodeproj || true
          fi

      - name: 🔨 Compile iOS Project (Simulator & Ad-Hoc Binary)
        run: |
          echo "Building iOS targets with Bonjour NSLocalNetworkUsageDescription..."
          if [ -d "ios" ]; then
            cd ios
          fi
          xcodebuild build \
            -project MafiaLAN.xcodeproj \
            -scheme MafiaLAN \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData \
            -quiet

      - name: 📦 Package iOS Simulator Binary / Archive
        run: |
          if [ -d "ios" ]; then
            cd ios
          fi
          mkdir -p build/artifacts
          find build/DerivedData/Build/Products -type d -name "MafiaLAN.app" -exec cp -R {} build/artifacts/ \; || true
          cd build/artifacts && zip -r ../MafiaLAN-iOS-Simulator.zip . || true

      - name: 📤 Upload iOS Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mafia-lan-ios-simulator-app
          path: |
            ios/build/*.zip
            build/*.zip
          retention-days: 14
          if-no-files-found: ignore

  # =========================================================================
  # 3b. RELEASE: Attach the APKs + iOS build to GitHub Releases automatically
  #     - push to main/master  -> updates the rolling "continuous" prerelease
  #     - push a tag v*        -> publishes a normal versioned release
  # =========================================================================
  release:
    name: 📦 Publish GitHub Release
    needs: [build-android, build-ios]
    if: |
      always() &&
      (needs.build-android.result == 'success' || needs.build-ios.result == 'success') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: 🗂️ Collect installables with stable names
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s globstar nullglob

          debug_apk=$(ls artifacts/mafia-lan-android-debug-apk/**/*.apk 2>/dev/null | head -1 || true)
          release_apk=$(ls artifacts/mafia-lan-android-release-apk/**/*.apk 2>/dev/null | head -1 || true)
          ios_zip=$(ls artifacts/mafia-lan-ios-simulator-app/**/*.zip 2>/dev/null | head -1 || true)

          [ -n "$debug_apk" ]   && cp "$debug_apk"   release-assets/mafia-lan-debug.apk
          [ -n "$release_apk" ] && cp "$release_apk" release-assets/mafia-lan-release.apk
          [ -n "$ios_zip" ]     && cp "$ios_zip"     release-assets/mafia-lan-ios-simulator.zip

          ls -lh release-assets

      - name: 🔐 Write checksums
        run: |
          cd release-assets
          shopt -s nullglob
          files=(./*.apk ./*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installables were produced by this run." > SHA256SUMS.txt
          else
            sha256sum "${files[@]}" > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: 📝 Compose release notes
        run: |
          {
            echo "## Mafia LAN — automated build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| PWA | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ |"
            echo
            echo "### Downloads"
            if [ -f release-assets/mafia-lan-debug.apk ]; then
              echo "- \`mafia-lan-debug.apk\` — sideload on Android (debug-signed)"
            fi
            if [ -f release-assets/mafia-lan-release.apk ]; then
              echo "- \`mafia-lan-release.apk\` — release build (currently signed with the debug keystore)"
            fi
            if [ -f release-assets/mafia-lan-ios-simulator.zip ]; then
              echo "- \`mafia-lan-ios-simulator.zip\` — iOS Simulator bundle (not installable on a physical iPhone)"
            fi
            echo "- **Play now (PWA):** no install needed — open the link above on any phone on the same Wi-Fi."
            echo
            echo "### Checksums"
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

      - name: 🚀 Publish rolling release (main branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: continuous
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Latest build (auto from ${{ github.ref_name }})" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "Latest build (auto from ${{ github.ref_name }})" \
              --notes-file release-notes.md \
              --prerelease \
              --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" release-assets/* --clobber

      - name: 🏷️ Publish versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Mafia LAN $TAG" --notes-file release-notes.md --verify-tag
          fi
          gh release upload "$TAG" release-assets/* --clobber

  # =========================================================================
  # 4. CI/CD SUMMARY & BUILD BADGE REPORT
  # =========================================================================
  build-summary:
    name: 📊 CI/CD Multiplatform Summary
    needs: [build-web, deploy-web, build-android, build-ios, release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📝 Generate Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🎭 Mafia LAN Multiplatform Build Status

          | Target Platform | Status | Artifact Output |
          |---|---|---|
          | 🌐 **Web App** | ${{ needs.build-web.result == 'success' && '✅ Succeeded' || '❌ Failed' }} | `mafia-lan-web-production` (`dist/`) |
          | 🚀 **Web PWA (Pages)** | ${{ needs.deploy-web.result == 'success' && '✅ Live' || '⏭️ Skipped / ❌ Failed' }} | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ |
          | 🤖 **Android APK** | ${{ needs.build-android.result == 'success' && '✅ Succeeded' || '❌ Failed' }} | `mafia-lan-android-debug-apk` (`.apk`) |
          | 🍎 **iOS App** | ${{ needs.build-ios.result == 'success' && '✅ Succeeded' || '❌ Failed' }} | `mafia-lan-ios-simulator-app` (`.zip`) |
          | 📦 **GitHub Release** | ${{ needs.release.result == 'success' && '✅ Published' || '⏭️ Skipped / ❌ Failed' }} | [Releases / Continuous](https://github.com/${{ github.repository }}/releases) |

          ### 🚀 Deployment Details
          - **Commit SHA:** `${{ github.sha }}`
          - **Triggered By:** `${{ github.event_name }}` on `${{ github.ref_name }}`
          - **Automated Tests:** `npm test` — deterministic rules engine, live P2P engine and signaling codecs.
          - **LAN Architecture:** Zero-configuration mDNS `_mafia-lan._tcp`, TLS 1.3 WebSockets, P2P WebRTC DataChannel.

          Download the generated APKs and archives directly from the **Releases** page or the **Artifacts** tab on this workflow run.
          EOF
